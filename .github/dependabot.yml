# Dependabot standard configuration.
# One entry per ecosystem and manifest directory, minor/patch updates grouped, an explicit
# open-pull-requests-limit, and the majors we hold on purpose ignored (remove an ignore only
# together with the story that delivers that migration).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      runtime-aligned:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*", "System.Text.Json", "System.Composition.*", "System.Security.Cryptography.*"]
        update-types: ["minor", "patch"]
      test-tooling:
        patterns: ["xunit*", "TUnit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Microsoft.Testing.*", "Moq*", "NSubstitute*", "FakeItEasy*", "FluentAssertions*", "Testcontainers*", "MartinCostello.Logging.XUnit*"]
        update-types: ["minor", "patch"]
      meshmakers:
        patterns: ["Meshmakers.*"]
        update-types: ["minor", "patch"]
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # held until the runtime major is adopted
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # held until the runtime major is adopted
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      # held until the runtime major is adopted
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      # held until the runtime major is adopted
      - dependency-name: "System.Composition.*"
        update-types: ["version-update:semver-major"]
      # held until the runtime major is adopted
      - dependency-name: "System.Security.Cryptography.*"
        update-types: ["version-update:semver-major"]
      # MassTransit 9 is held on purpose
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      # Telerik majors follow a licensed upgrade
      - dependency-name: "Telerik.*"
        update-types: ["version-update:semver-major"]
      # KubeOps majors are planned migrations
      - dependency-name: "KubeOps.*"
        update-types: ["version-update:semver-major"]
